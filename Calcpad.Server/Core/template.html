        body {
            background-color: white;
            color: black;
            font-size: 11pt;
            font-family: 'Segoe UI', 'Arial Nova', Helvetica, sans-serif;
            margin-left: 5mm;
            max-width: 190mm;
        }

        h1, h2, h3, h4, h5, h6, .errorHeader, .roundBox {
            font-family: 'Arial Nova', Helvetica, sans-serif;
            margin: 0.5em 0 0.5em 0;
            padding: 0;
            line-height: 150%;
        }

        h1 {font-size: 2.1em;}
        h2 {font-size: 1.7em;}
        h3 {font-size: 1.4em;}
        h4 {font-size: 1.2em;}
        h5 {font-size: 1.1em;}
        h6 {font-size: 1em;}

        p, li {
            margin: 0.3em 0 0.3em 0;
            padding: 0;
            line-height: 150%;
        }

        select, kbd {
            font-family: 'Segoe UI', sans-serif;
        }

        a:hover {
            background-color: #e9f6ff;
        }

        .eq, input[type="text"], table.matrix {
            font-family: 'Georgia Pro', 'Century Schoolbook', 'Times New Roman', Times, serif;
        }

            .eq var {
                color: #06d;
                font-size: 105%;
            }

            .eq i {
                color: #086;
                font-style: normal;
